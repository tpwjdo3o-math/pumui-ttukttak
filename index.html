<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>품의뚝딱</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Pretendard,
        "Noto Sans KR",
        Arial,
        sans-serif;
      background: #f7f5fb;
      color: #242424;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    .container {
      width: min(900px, calc(100% - 32px));
      margin: 45px auto;
    }

    /* 상단 */

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .magic-icon {
      font-size: 54px;
      margin-bottom: 4px;
    }

    .header h1 {
      margin: 0;
      font-size: 38px;
      color: #5b3da8;
    }

    .header p {
      margin: 10px 0 0;
      color: #777;
      font-size: 16px;
    }

    /* 기본 카드 */

    .card {
      background: white;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(50, 30, 80, 0.08);
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 9px;
      font-size: 15px;
    }

    .required {
      color: #805ad5;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #ddd9e5;
      border-radius: 10px;
      padding: 13px 14px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    input:focus,
    textarea:focus {
      border-color: #7653c6;
      box-shadow: 0 0 0 3px rgba(118, 83, 198, 0.1);
    }

    input::placeholder,
    textarea::placeholder {
      color: #aaa6b0;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .helper {
      margin-top: 7px;
      color: #999;
      font-size: 13px;
      line-height: 1.6;
    }

    /* 이미지 업로드 */

    .upload-zone {
      border: 2px dashed #b9a7df;
      border-radius: 16px;
      min-height: 190px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      background: #faf8ff;
      transition: 0.2s;
      outline: none;
    }

    .upload-zone:hover,
    .upload-zone.dragging,
    .upload-zone:focus {
      background: #f3effd;
      border-color: #7653c6;
    }

    .upload-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .upload-main {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .upload-sub {
      color: #777;
      font-size: 14px;
      line-height: 1.8;
    }

    .shortcut {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 5px;
      background: #ebe6f5;
      color: #5b3da8;
      font-weight: 700;
    }

    #fileInput {
      display: none;
    }

    /* 미리보기 */

    #previewArea {
      display: none;
      margin-top: 20px;
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .preview-title {
      font-weight: 700;
    }

    .image-count {
      color: #7653c6;
      font-size: 13px;
      font-weight: 700;
    }

    .preview-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .preview-item {
      position: relative;
      border: 1px solid #e2dfea;
      border-radius: 12px;
      overflow: hidden;
      background: #fafafa;
      aspect-ratio: 4 / 3;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .delete-button {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.75);
      color: white;
      cursor: pointer;
      font-size: 18px;
    }

    /* 실행 버튼 */

    .make-button {
      width: 100%;
      margin-top: 10px;
      padding: 16px;
      border: none;
      border-radius: 13px;
      background: #6546b4;
      color: white;
      cursor: pointer;
      font-size: 18px;
      font-weight: 800;
      transition: 0.2s;
    }

    .make-button:hover:not(:disabled) {
      transform: translateY(-1px);
      background: #5639a2;
    }

    .make-button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    /* 메시지 */

    .message {
      display: none;
      margin-top: 18px;
      padding: 15px 16px;
      border-radius: 12px;
      background: #f1edfc;
      color: #513591;
      font-size: 14px;
      line-height: 1.7;
    }

    /* 분석 결과 */

    .result-card {
      margin-top: 30px;
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(50, 30, 80, 0.08);
    }

    .result-card h2 {
      margin: 0 0 18px;
      color: #4f368e;
      font-size: 24px;
    }

    .analysis-summary {
      padding: 14px 16px;
      margin-bottom: 20px;
      background: #f6f2ff;
      border-radius: 11px;
      line-height: 1.7;
    }

    .result-section {
      margin-top: 24px;
    }

    .result-section-title {
      margin-bottom: 9px;
      font-weight: 800;
    }

    .purpose-sentence {
      padding: 14px;
      border: 1px solid #ebe8ef;
      border-radius: 10px;
      background: #fafafa;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .result-table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
    }

    .result-table th {
      padding: 11px 8px;
      border: 1px solid #ddd9e5;
      background: #f3effd;
      font-size: 13px;
      white-space: nowrap;
    }

    .result-table td {
      padding: 11px 8px;
      border: 1px solid #ddd9e5;
      font-size: 13px;
      text-align: center;
    }

    .shipping-row {
      background: #faf8ff;
    }

    .warning-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #fff6df;
      color: #6a5200;
      line-height: 1.8;
      font-size: 14px;
    }

    .success-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #effaf2;
      color: #26653a;
      line-height: 1.7;
      font-size: 14px;
    }

    @media (max-width: 650px) {
      .container {
        margin: 24px auto;
      }

      .card,
      .result-card {
        padding: 21px;
      }

      .header h1 {
        font-size: 31px;
      }

      .preview-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">
      <div class="magic-icon">🪄</div>
      <h1>품의뚝딱</h1>
      <p>장바구니 캡처 한 장으로 품의 준비를 뚝딱!</p>
    </header>


    <section class="card">

      <!-- 제목 -->

      <div class="form-group">
        <label for="title">
          품의 제목 <span class="required">*</span>
        </label>

        <input
          id="title"
          type="text"
          placeholder="예: 2026. 2학기 수학과 수업 운영 물품 구입"
        >
      </div>


      <!-- 관련 문서 -->

      <div class="form-group">
        <label for="relatedDoc">
          관련 문서
        </label>

        <input
          id="relatedDoc"
          type="text"
          placeholder="예: 원봉중학교-1234(2026. 9. 16.)"
        >

        <div class="helper">
          관련 문서가 없는 경우 비워두세요.
        </div>
      </div>


      <!-- 추가 설명 -->

      <div class="form-group">
        <label for="extraInfo">
          추가 설명
        </label>

        <textarea
          id="extraInfo"
          placeholder="예: 학생 체험활동에 사용할 재료이며, 수업 운영 목적에 맞게 작성해 주세요."
        ></textarea>

        <div class="helper">
          품의 목적이나 AI가 알아야 할 내용이 있는 경우에만 입력하세요.
        </div>
      </div>


      <!-- 이미지 -->

      <div class="form-group">

        <label>
          장바구니 이미지 <span class="required">*</span>
        </label>

        <div
          id="uploadZone"
          class="upload-zone"
          tabindex="0"
        >

          <div class="upload-icon">📸</div>

          <div class="upload-main">
            장바구니 캡처를 올려주세요
          </div>

          <div class="upload-sub">
            클릭해서 이미지 파일을 선택하거나<br>
            화면 캡처 후
            <span class="shortcut">Ctrl + V</span>
            로 바로 붙여넣으세요.<br>
            여러 장도 가능합니다.
          </div>

        </div>

        <input
          id="fileInput"
          type="file"
          accept="image/*"
          multiple
        >

        <div id="previewArea">

          <div class="preview-header">
            <span class="preview-title">
              첨부 이미지
            </span>

            <span
              id="imageCount"
              class="image-count"
            >
              0장
            </span>
          </div>

          <div
            id="previewList"
            class="preview-list"
          ></div>

        </div>

      </div>


      <button
        id="makeButton"
        class="make-button"
        type="button"
      >
        🪄 품의 만들기
      </button>


      <div
        id="message"
        class="message"
      ></div>

    </section>


    <section
      id="analysisResult"
      class="result-card"
      style="display:none;"
    ></section>

  </main>


<script>

  const uploadZone =
    document.getElementById("uploadZone");

  const fileInput =
    document.getElementById("fileInput");

  const previewArea =
    document.getElementById("previewArea");

  const previewList =
    document.getElementById("previewList");

  const imageCount =
    document.getElementById("imageCount");

  const makeButton =
    document.getElementById("makeButton");

  const message =
    document.getElementById("message");

  const analysisResult =
    document.getElementById("analysisResult");


  let selectedImages = [];


  /*
   * 이미지 선택
   */

  uploadZone.addEventListener(
    "click",
    () => fileInput.click()
  );


  uploadZone.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" ||
        event.key === " "
      ) {
        event.preventDefault();
        fileInput.click();
      }

    }
  );


  fileInput.addEventListener(
    "change",
    event => {

      addImages(
        Array.from(event.target.files)
      );

      fileInput.value = "";

    }
  );


  /*
   * 드래그 앤 드롭
   */

  uploadZone.addEventListener(
    "dragover",
    event => {

      event.preventDefault();

      uploadZone.classList.add(
        "dragging"
      );

    }
  );


  uploadZone.addEventListener(
    "dragleave",
    () => {

      uploadZone.classList.remove(
        "dragging"
      );

    }
  );


  uploadZone.addEventListener(
    "drop",
    event => {

      event.preventDefault();

      uploadZone.classList.remove(
        "dragging"
      );

      addImages(
        Array.from(
          event.dataTransfer.files
        )
      );

    }
  );


  /*
   * Ctrl + V 이미지 붙여넣기
   */

  document.addEventListener(
    "paste",
    event => {

      const clipboardItems =
        Array.from(
          event.clipboardData?.items || []
        );

      const pastedImages = [];


      clipboardItems.forEach(item => {

        if (
          item.kind === "file" &&
          item.type.startsWith("image/")
        ) {

          const file =
            item.getAsFile();

          if (file) {
            pastedImages.push(file);
          }

        }

      });


      /*
       * 이미지가 클립보드에 있으면
       * 어느 위치에서 Ctrl+V를 눌렀든
       * 이미지 업로드로 처리
       */

      if (pastedImages.length > 0) {

        event.preventDefault();

        addImages(pastedImages);

      }

    }
  );


  /*
   * 이미지 추가
   */

  function addImages(files) {

    const imageFiles =
      files.filter(
        file =>
          file.type.startsWith("image/")
      );


    if (imageFiles.length === 0) {

      showMessage(
        "이미지 파일을 확인해 주세요."
      );

      return;

    }


    imageFiles.forEach(file => {

      selectedImages.push({
        file,
        previewUrl:
          URL.createObjectURL(file)
      });

    });


    renderImages();

    hideMessage();

  }


  /*
   * 이미지 미리보기
   */

  function renderImages() {

    previewList.innerHTML = "";


    if (
      selectedImages.length === 0
    ) {

      previewArea.style.display =
        "none";

      return;

    }


    previewArea.style.display =
      "block";


    imageCount.textContent =
      `${selectedImages.length}장`;


    selectedImages.forEach(
      (image, index) => {

        const item =
          document.createElement("div");

        item.className =
          "preview-item";


        const img =
          document.createElement("img");

        img.src =
          image.previewUrl;

        img.alt =
          `장바구니 이미지 ${index + 1}`;


        const deleteButton =
          document.createElement("button");

        deleteButton.className =
          "delete-button";

        deleteButton.type =
          "button";

        deleteButton.textContent =
          "×";

        deleteButton.title =
          "이미지 삭제";


        deleteButton.addEventListener(
          "click",
          event => {

            event.stopPropagation();

            removeImage(index);

          }
        );


        item.appendChild(img);
        item.appendChild(deleteButton);

        previewList.appendChild(item);

      }
    );

  }


  /*
   * 이미지 삭제
   */

  function removeImage(index) {

    URL.revokeObjectURL(
      selectedImages[index].previewUrl
    );

    selectedImages.splice(
      index,
      1
    );

    renderImages();

  }


  /*
   * 메시지
   */

  function showMessage(text) {

    message.textContent =
      text;

    message.style.display =
      "block";

  }


  function hideMessage() {

    message.style.display =
      "none";

  }


  /*
   * 이미지 압축
   */

  function compressImage(file) {

    return new Promise(
      (resolve, reject) => {

        const reader =
          new FileReader();


        reader.onload = event => {

          const img =
            new Image();


          img.onload = () => {

            const maxWidth = 1600;
            const maxHeight = 2400;

            let width =
              img.width;

            let height =
              img.height;


            const ratio =
              Math.min(
                maxWidth / width,
                maxHeight / height,
                1
              );


            width =
              Math.round(
                width * ratio
              );

            height =
              Math.round(
                height * ratio
              );


            const canvas =
              document.createElement(
                "canvas"
              );

            canvas.width =
              width;

            canvas.height =
              height;


            const context =
              canvas.getContext("2d");


            context.drawImage(
              img,
              0,
              0,
              width,
              height
            );


            const dataUrl =
              canvas.toDataURL(
                "image/jpeg",
                0.82
              );


            resolve(dataUrl);

          };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


        reader.onerror =
          reject;


        reader.readAsDataURL(file);

      }
    );

  }


  /*
   * 금액 표시
   */

  function formatMoney(value) {

    const number =
      Number(value);

    if (
      !Number.isFinite(number)
    ) {
      return "-";
    }

    return (
      number.toLocaleString("ko-KR")
      + "원"
    );

  }


  /*
   * 안전하게 셀 만들기
   */

  function createCell(
    value,
    className = ""
  ) {

    const td =
      document.createElement("td");

    td.textContent =
      value ?? "";

    if (className) {
      td.className =
        className;
    }

    return td;

  }


  /*
   * 결과 화면
   */

  function showAnalysisResult(result) {

    analysisResult.innerHTML = "";

    analysisResult.style.display =
      "block";


    const items =
      Array.isArray(result.items)
        ? result.items
        : [];


    const warnings =
      Array.isArray(result.warnings)
        ? result.warnings
        : [];


    /*
     * 제목
     */

    const heading =
      document.createElement("h2");

    heading.textContent =
      "🪄 장바구니 분석 결과";

    analysisResult.appendChild(
      heading
    );


    /*
     * 요약
     */

    const productCount =
      items.filter(
        item =>
          item.item_type !==
          "shipping"
      ).length;


    const shippingCount =
      items.filter(
        item =>
          item.item_type ===
          "shipping"
      ).length;


    const summary =
      document.createElement("div");

    summary.className =
      "analysis-summary";

    summary.textContent =
      `상품 ${productCount}개 · 배송비 ${shippingCount}건 · 확인 필요 ${warnings.length}건`;

    analysisResult.appendChild(
      summary
    );


    /*
     * 개요 첫 문장
     */

    const sentenceSection =
      document.createElement("div");

    sentenceSection.className =
      "result-section";


    const sentenceTitle =
      document.createElement("div");

    sentenceTitle.className =
      "result-section-title";

    sentenceTitle.textContent =
      "개요 문장";


    const sentence =
      document.createElement("div");

    sentence.className =
      "purpose-sentence";

    sentence.textContent =
      result.purpose_sentence ||
      "개요 문장을 생성하지 못했습니다.";


    sentenceSection.appendChild(
      sentenceTitle
    );

    sentenceSection.appendChild(
      sentence
    );

    analysisResult.appendChild(
      sentenceSection
    );


    /*
     * 품목표
     */

    const tableSection =
      document.createElement("div");

    tableSection.className =
      "result-section";


    const tableTitle =
      document.createElement("div");

    tableTitle.className =
      "result-section-title";

    tableTitle.textContent =
      "품목 내역";


    const tableWrap =
      document.createElement("div");

    tableWrap.className =
      "table-wrap";


    const table =
      document.createElement("table");

    table.className =
      "result-table";


    const thead =
      document.createElement("thead");


    const headerRow =
      document.createElement("tr");


    [
      "품명",
      "규격",
      "수량",
      "단위",
      "단가",
      "금액",
      "확인"
    ].forEach(text => {

      const th =
        document.createElement("th");

      th.textContent =
        text;

      headerRow.appendChild(th);

    });


    thead.appendChild(
      headerRow
    );


    const tbody =
      document.createElement("tbody");


    items.forEach(item => {

      const row =
        document.createElement("tr");


      if (
        item.item_type ===
        "shipping"
      ) {
        row.classList.add(
          "shipping-row"
        );
      }


      let status = "✅";

      if (
        item.confidence ===
        "medium"
      ) {
        status = "⚠️";
      }

      if (
        item.confidence ===
        "low"
      ) {
        status = "❗";
      }


      const productName =
        item.item_type ===
        "shipping"
          ? `${item.product_name} 🚚`
          : item.product_name;


      row.appendChild(
        createCell(
          productName
        )
      );

      row.appendChild(
        createCell(
          item.specification
        )
      );

      row.appendChild(
        createCell(
          item.quantity
        )
      );

      row.appendChild(
        createCell(
          item.unit
        )
      );

      row.appendChild(
        createCell(
          formatMoney(
            item.unit_price
          )
        )
      );

      row.appendChild(
        createCell(
          formatMoney(
            item.amount
          )
        )
      );


      const statusCell =
        createCell(status);

      if (item.note) {
        statusCell.title =
          item.note;
      }

      row.appendChild(
        statusCell
      );


      tbody.appendChild(row);

    });


    table.appendChild(thead);
    table.appendChild(tbody);

    tableWrap.appendChild(table);

    tableSection.appendChild(
      tableTitle
    );

    tableSection.appendChild(
      tableWrap
    );

    analysisResult.appendChild(
      tableSection
    );


    /*
     * 경고
     */

    if (warnings.length > 0) {

      const warningBox =
        document.createElement("div");

      warningBox.className =
        "warning-box";


      const warningTitle =
        document.createElement("strong");

      warningTitle.textContent =
        "⚠️ 확인이 필요한 내용";


      warningBox.appendChild(
        warningTitle
      );


      warnings.forEach(warning => {

        const line =
          document.createElement("div");

        line.textContent =
          `• ${warning}`;

        warningBox.appendChild(line);

      });


      analysisResult.appendChild(
        warningBox
      );

    } else {

      const success =
        document.createElement("div");

      success.className =
        "success-box";

      success.textContent =
        "✅ AI가 별도의 확인 필요 항목을 발견하지 않았습니다. 그래도 품목과 금액은 최종 확인해 주세요.";

      analysisResult.appendChild(
        success
      );

    }


    analysisResult.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }


  /*
   * 품의 만들기
   */

  makeButton.addEventListener(
    "click",
    async () => {

      const title =
        document
          .getElementById("title")
          .value
          .trim();


      const relatedDoc =
        document
          .getElementById(
            "relatedDoc"
          )
          .value
          .trim();


      const extraInfo =
        document
          .getElementById(
            "extraInfo"
          )
          .value
          .trim();


      /*
       * 입력 확인
       */

      if (!title) {

        showMessage(
          "품의 제목을 입력해 주세요."
        );

        document
          .getElementById("title")
          .focus();

        return;

      }


      if (
        selectedImages.length === 0
      ) {

        showMessage(
          "장바구니 이미지를 붙여넣거나 업로드해 주세요."
        );

        uploadZone.focus();

        return;

      }


      try {

        makeButton.disabled =
          true;

        makeButton.textContent =
          "🪄 장바구니 분석 중...";


        showMessage(
          "AI가 상품명, 옵션, 수량, 가격과 배송비를 확인하고 있습니다. 잠시만 기다려 주세요."
        );


        analysisResult.style.display =
          "none";


        /*
         * 이미지 압축
         */

        const images =
          await Promise.all(

            selectedImages.map(
              image =>
                compressImage(
                  image.file
                )
            )

          );


        /*
         * API 요청
         */

        const response =
          await fetch(
            "/api/analyze",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  title,
                  relatedDoc,
                  extraInfo,
                  images
                })

            }
          );


        let result;


        try {

          result =
            await response.json();

        } catch {

          throw new Error(
            "서버 응답을 읽지 못했습니다."
          );

        }


        if (!response.ok) {

          throw new Error(
            result.error ||
            "장바구니 분석에 실패했습니다."
          );

        }


        hideMessage();

        showAnalysisResult(
          result
        );


      } catch (error) {

        console.error(error);


        showMessage(
          "❌ 오류가 발생했습니다: "
          + error.message
        );


      } finally {

        makeButton.disabled =
          false;

        makeButton.textContent =
          "🪄 품의 만들기";

      }

    }
  );

</script>

</body>
</html>
